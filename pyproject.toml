[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "run-heatmap"
version = "0.1.0"
description = "Draw every run you've done as a glowing heatmap, from GPX/TCX/FIT exports."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "Pillow>=10.1", "fitdecode>=0.10"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
run-heatmap = "heatmap.cli:main"

[tool.setuptools]
packages = ["heatmap"]
